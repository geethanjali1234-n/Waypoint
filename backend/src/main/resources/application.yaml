waypoint:
  # Application uploads always use MongoDB GridFS. The local root remains only
  # as a legacy-file migration/read fallback.
  resume-storage-root: ${RESUME_STORAGE_ROOT:uploads}
  resume-max-file-size: ${RESUME_MAX_FILE_SIZE:10485760}
  startup:
    database-initializer:
      enabled: ${DATABASE_INITIALIZER_ENABLED:false}
    resume-storage-migration:
      enabled: ${RESUME_STORAGE_MIGRATION_ENABLED:false}
    file-storage-migration:
      enabled: ${FILE_STORAGE_MIGRATION_ENABLED:false}
    object-storage-migration:
      enabled: ${OBJECT_STORAGE_MIGRATION_ENABLED:false}
    event-location-migration:
      enabled: ${EVENT_LOCATION_MIGRATION_ENABLED:false}
    job-location-migration:
      enabled: ${JOB_LOCATION_MIGRATION_ENABLED:false}
  documents:
    local:
      root: ${DOCUMENT_LOCAL_STORAGE_ROOT:./uploads/object-store}
    migrate-local-on-startup: ${DOCUMENT_STORAGE_MIGRATION_ENABLED:true}
    r2:
      # Shared document storage is the default. Local development must explicitly
      # opt out with R2_ENABLED=false.
      enabled: ${R2_ENABLED:true}
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      endpoint: ${R2_ENDPOINT:}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from-address: ${MAIL_FROM_ADDRESS:noreply@waypoint.local}
    from-name: ${MAIL_FROM_NAME:Waypoint}
    # Comma-separated domains (or exact addresses) you have ALREADY verified with the SMTP provider (a verified domain
    # with SPF/DKIM, a verified single sender, or a Gmail 'Send mail as' alias). This is an operator assertion only:
    # it does not check anything with Gmail, SES, SendGrid, etc. An organization's Organization Email (from the
    # database) is used as the From address only if it matches an entry exactly (no wildcards, no subdomains);
    # otherwise mail is sent from from-address. A clear provider rejection of the organization's address is retried
    # once from from-address. Malformed entries are ignored with a startup warning. Empty (default) = always send
    # from from-address.
    authorized-sender-domains: ${MAIL_AUTHORIZED_SENDER_DOMAINS:}
  google:
    # Per-organization Gmail sending: each organization authorizes its own Google account through the WayPoint
    # OAuth client. Off by default; when enabled, every key below except the key id must be set (startup fails
    # otherwise). The client secret and the token encryption key (Base64 of 32 random bytes) belong in secret
    # storage only. SMTP stays the fallback for every message.
    enabled: ${GOOGLE_EMAIL_ENABLED:false}
    # Dedicated WayPoint transactional sender. This is independent of organization connections.
    platform-sender-enabled: ${GOOGLE_PLATFORM_SENDER_ENABLED:false}
    platform-sender-address: ${GOOGLE_PLATFORM_SENDER_ADDRESS:}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:}
    token-encryption-key-id: ${GOOGLE_TOKEN_ENCRYPTION_KEY_ID:v1}
  app:
    # Absolute web address used for links in approval emails (e.g. "Review Offer Letter").
    frontend-base-url: ${APP_FRONTEND_URL:http://localhost:5173}
  myhr:
    dev-credentials:
      # Local first-login testing only. Never enable in shared or production environments.
      enabled: ${MYHR_DEV_CREDENTIALS_ENABLED:true}
      open-terminal: ${MYHR_DEV_CREDENTIALS_OPEN_TERMINAL:true}
    dev-provisioning:
      # Explicitly opt in for one local/development run. Generated credentials
      # are printed only while this switch is enabled.
      enabled: ${MYHR_DEV_PROVISIONING_ENABLED:false}
      organization-id: ${MYHR_DEV_ORGANIZATION_ID:}
      admin-email: ${MYHR_DEV_COMPANY_ADMIN_EMAIL:}
    payroll-readiness:
      automatic-reminders-enabled: ${PAYROLL_READINESS_AUTOMATIC_REMINDERS_ENABLED:true}
      cutoff-day: ${PAYROLL_READINESS_CUTOFF_DAY:10}
      employee-reminder-days: ${PAYROLL_READINESS_EMPLOYEE_REMINDER_DAYS:5,7,9,10}
      management-summary-days: ${PAYROLL_READINESS_MANAGEMENT_SUMMARY_DAYS:7,9,10}
      batch-size: ${PAYROLL_READINESS_BATCH_SIZE:250}
      zone-id: ${PAYROLL_READINESS_ZONE_ID:America/Chicago}
      scheduler-cron: ${PAYROLL_READINESS_SCHEDULER_CRON:0 15 2 * * *}
      standard-workday-hours: ${PAYROLL_READINESS_STANDARD_WORKDAY_HOURS:8}
      require-weekend-coverage: ${PAYROLL_READINESS_REQUIRE_WEEKEND_COVERAGE:false}
    ai:
      # Claude is the default for permitted general chat; temporary Claude outages fall back to
      # verified-local Ollama unless Claude-only mode is explicitly enabled.
      primary-provider: ${MYHR_AI_PRIMARY_PROVIDER:claude}
      claude-only:
        # Claude writes every AI-generated chat reply and Ollama is never called: when Claude is unavailable
        # the assistant says so (HTTP 503). Requires primary-provider claude. Policy excerpts still reach Claude
        # only as described under chat.knowledge-grounding.allow-external-provider. Keep false until approved.
        enabled: ${MYHR_AI_CLAUDE_ONLY_ENABLED:false}
      claude:
        api-key: ${CLAUDE_API_KEY:}
        api-url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
        model: ${CLAUDE_API_MODEL:claude-sonnet-5}
        timeout: ${CLAUDE_API_TIMEOUT:60s}
        # Output-token limit per chat reply; model thinking counts toward it. A reply that reaches it is cut
        # off and is never shown (the Ollama fallback answers instead).
        max-tokens: ${CLAUDE_API_MAX_TOKENS:4096}
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_MODEL:llama3.1:8b}
        timeout: ${OLLAMA_TIMEOUT:5m}
        # Output-token limit for a grounded (policy) answer (64-8192); an answer cut off at it is never shown.
        grounded-max-tokens: ${OLLAMA_GROUNDED_MAX_TOKENS:1024}
        # How long Ollama keeps the model loaded after a request, e.g. 30m. Empty = Ollama's default (5m); a cold
        # load of llama3.1:8b adds its load time to the next answer.
        keep-alive: ${OLLAMA_KEEP_ALIVE:}
      voyage:
        api-key: ${VOYAGE_API_KEY:}
        api-url: ${VOYAGE_API_URL:https://api.voyageai.com/v1/embeddings}
        model: ${VOYAGE_MODEL:voyage-4-lite}
        dimensions: ${VOYAGE_DIMENSIONS:1024}
        timeout: ${VOYAGE_TIMEOUT:30s}
    # MyHR knowledge base (RAG). Every switch defaults to off; enable only with team approval.
    knowledge:
      management:
        # HR/admin upload, approval, replacement and ingestion requests. Listing and revocation stay available.
        enabled: ${MYHR_KNOWLEDGE_MANAGEMENT_ENABLED:false}
      ingestion:
        # Sends approved policy text to the Voyage embedding provider; also requires management.enabled.
        # COMPANY_WIDE text is governed by this switch alone. HR_ONLY text is embedded only when a Company Admin
        # has recorded the organization's Voyage approval for HR_ONLY (/api/myhr/knowledge/external-processing);
        # EMPLOYEE_PRIVATE is never embedded. A Claude approval never counts as a Voyage approval.
        enabled: ${MYHR_KNOWLEDGE_INGESTION_ENABLED:false}
      activation:
        enabled: ${MYHR_KNOWLEDGE_ACTIVATION_ENABLED:false}
      retrieval:
        enabled: ${MYHR_KNOWLEDGE_RETRIEVAL_ENABLED:false}
        # Minimum Atlas cosine vectorSearchScore ((1 + cosine) / 2) for a chunk to be used as context.
        min-score: ${MYHR_KNOWLEDGE_RETRIEVAL_MIN_SCORE:0.0}
        # Drops candidates scoring more than this below the best match (same score scale as min-score), so excerpts
        # from a much less relevant policy are not supplied with the right one. 0 = off. Calibrate against the live
        # index before enabling; offline tests only verify the mechanism.
        relative-score-margin: ${MYHR_KNOWLEDGE_RETRIEVAL_RELATIVE_SCORE_MARGIN:0.0}
    chat:
      # Master switch for the Claude-first Wavy chat (POST /api/myhr/chat). OFF by default so that merging this code
      # changes nothing in an existing deployment: no chat endpoint exists and nothing is sent to any AI provider.
      enabled: ${MYHR_CHAT_ENABLED:false}
      knowledge-grounding:
        # Grounds chat answers in approved policies; also requires knowledge.retrieval.enabled.
        enabled: ${MYHR_CHAT_KNOWLEDGE_GROUNDING_ENABLED:false}
        # Deployment switch that lets Claude, an external provider, be considered for policy answers. On its
        # own it sends nothing: Claude also needs every retrieved excerpt to be COMPANY_WIDE (HR_ONLY and
        # EMPLOYEE_PRIVATE never leave Waypoint) and an organization-level ExternalPolicyProcessingAuthorization
        # that permits those excerpts: a Company Admin's recorded organization approval for Claude AND a recorded
        # approval of each excerpt's exact activated policy version. None exist by default, so policy answers stay
        # on verified-local Ollama. Keep false until the company has explicitly approved this.
        # Not covered here: Voyage receives the question text (every grounded chat) and approved policy chunk text
        # at ingestion; see knowledge.ingestion.enabled.
        allow-external-provider: ${MYHR_CHAT_KNOWLEDGE_ALLOW_EXTERNAL_PROVIDER:false}
    document-request-reminders:
      # Off by default. Turn on explicitly with DOCUMENT_REQUEST_REMINDERS_ENABLED=true.
      enabled: ${DOCUMENT_REQUEST_REMINDERS_ENABLED:false}
      zone-id: ${DOCUMENT_REQUEST_REMINDERS_ZONE_ID:America/Chicago}
      # Daily run time (Spring cron, in zone-id). Default 8:00 AM.
      scheduler-cron: ${DOCUMENT_REQUEST_REMINDERS_SCHEDULER_CRON:0 0 8 * * *}
    timesheet-document-ai:
      # Cloud vision-based extraction used as a fallback when the local, deterministic
      # parser (regex/table based) and local Tesseract OCR can't read a document (e.g. a
      # scanned PDF/image on a machine without Tesseract installed). Leave the API key
      # blank to disable this entirely and rely on local parsing only.
      api-key: ${CLAUDE_API_KEY:}
      api-url: ${CLAUDE_API_URL:https://api.anthropic.com/v1/messages}
      model: ${CLAUDE_API_MODEL:claude-sonnet-5}
  geocoding:
    nominatim:
      base-url: ${GEOCODING_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org/search}
      # Required by Nominatim's usage policy to identify the calling app.
      user-agent: "${GEOCODING_USER_AGENT:WayPoint-App (contact support@waypoint.example)}"
      timeout-ms: ${GEOCODING_TIMEOUT_MS:5000}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: backend

  data:
    mongodb:
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:false}

  mongodb:
    # Accept the existing team variable name as a compatibility alias.
    uri: ${MONGODB_URI:${MONGODB_URL}}
    database: ${MONGODB_DATABASE:waypoint}

  mail:
    # Use a local SMTP endpoint by default so the application can start during
    # local development. Set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD for a real
    # SMTP provider before using email verification or notifications.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

server:
  # Canonical local development endpoint. Bound to 0.0.0.0 to accept both
  # localhost and LAN connections from mobile devices/installed APKs.
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      persistent: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:10800000}

openweather:
  api-key: ${OPENWEATHER_API_KEY:}
  geocoding-url: https://api.openweathermap.org/geo/1.0/direct
  forecast-url: https://api.openweathermap.org/data/2.5/forecast

app:
  auth:
    # Local password-reset testing only. When enabled, the reset OTP is written
    # to the backend log; it is never returned to the browser or stored raw.
    expose-dev-otp: ${EXPOSE_DEV_OTP:false}
    # Local Phase 2 testing only. Keep false outside an explicitly controlled
    # development run. This writes organization-registration OTPs to the local
    # backend terminal and never adds them to an API response.
    organization-registration-dev-otp-enabled: ${ORGANIZATION_REGISTRATION_DEV_OTP_ENABLED:false}
